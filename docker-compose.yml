# polskiprimal.pl — one command to run everything:
#
#   docker compose up --build            # local: http://localhost (no .env needed)
#   docker compose --profile minio up    # + local S3 (MinIO) instead of AWS
#
# Production (real domain, automatic HTTPS): set SITE_ADDRESS and the S3 variables in .env,
# then run `docker compose up -d --build`. See DEPLOY.md.

name: polskiprimal

services:
  app:
    build: .
    restart: unless-stopped
    # Optional .env (requires Docker Compose >= 2.24). Never committed to git.
    env_file:
      - path: .env
        required: false
    environment:
      # Without any .env the site starts with the in-memory backend, pre-loaded with the
      # starter content from content/ (data is lost on restart). Set STORAGE_BACKEND=s3 for real data.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-memory}
      APP_ENV: ${APP_ENV:-dev}
      BASE_URL: ${BASE_URL:-http://localhost}
    # No published ports: only Caddy reaches the app, over the private compose network.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Default = plain HTTP on localhost. For production use your domain(s), e.g.
      # SITE_ADDRESS="polskiprimal.pl, www.polskiprimal.pl"
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates + ACME account: keep this volume!
      - caddy_config:/config

  # --- Optional local S3 (docker compose --profile minio up) ---------------------------
  # In .env use: STORAGE_BACKEND=s3, S3_BUCKET=polskiprimal-data, AWS_REGION=us-east-1,
  # AWS_ACCESS_KEY_ID=minioadmin, AWS_SECRET_ACCESS_KEY=minioadmin (same as MINIO_ROOT_*),
  # S3_ENDPOINT_URL=http://minio:9000
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Bound to localhost only: for development, never expose MinIO to the internet.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - minio_data:/data

  # Creates the bucket in MinIO, then exits.
  minio-init:
    profiles: ["minio"]
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do echo "waiting for minio..."; sleep 1; done;
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-polskiprimal-data}

volumes:
  caddy_data:
  caddy_config:
  minio_data:

[project]
name = "polskiprimal-platform"
version = "0.1.0"
description = "polskiprimal.pl — Polish healthy-food / farm-to-table platform (Phase 1, Option A: FastAPI + S3, no database)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "jinja2>=3.1,<3.2",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.12,<0.1",
    "boto3>=1.35,<2.0",
    "markdown>=3.7,<4.0",
    "email-validator>=2.2,<3.0",  # required by pydantic EmailStr
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<0.28",
    "anyio>=4.4,<5.0",  # pytest plugin for async tests (@pytest.mark.anyio)
    "moto[s3]>=5.0,<6.0",  # in-process S3 mock for the contract suite
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

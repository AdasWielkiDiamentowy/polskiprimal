<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{% if title and title != site_name %}{{ title }} — {{ site_name }}{% else %}{{ site_name }}{% endif %}{% endblock %}</title>
  <meta name="description" content="polskiprimal.pl — zdrowe jedzenie, lokalni rolnicy, dieta primal i keto." />
  <meta name="theme-color" content="#2e7d32" />

  <!-- Theme tokens (from config/theme.json via theme_service) as CSS custom properties. -->
  <style id="theme-variables">
{{ theme_css | safe }}
  </style>
  <style>
    body { font-family: var(--font-family); }
    /* Plain-CSS fallbacks so branding works even if the Tailwind CDN is unreachable. */
    .text-primary { color: var(--primary-color); }
    .bg-primary { background-color: var(--primary-color); }
    .text-accent { color: var(--accent-color); }
    .bg-accent { background-color: var(--accent-color); }
    [x-cloak] { display: none !important; }
    /* Markdown body */
    .content-body { line-height: 1.75; overflow-wrap: anywhere; }
    .content-body > * + * { margin-top: 1rem; }
    .content-body h1, .content-body h2, .content-body h3 { font-weight: 700; line-height: 1.3; margin-top: 1.75rem; }
    .content-body h1 { font-size: 1.75rem; }
    .content-body h2 { font-size: 1.4rem; }
    .content-body h3 { font-size: 1.15rem; }
    .content-body ul { list-style: disc; padding-left: 1.5rem; }
    .content-body ol { list-style: decimal; padding-left: 1.5rem; }
    .content-body a { color: var(--primary-color); text-decoration: underline; }
    .content-body blockquote { border-left: 4px solid var(--accent-color); padding-left: 1rem; color: #4b5563; }
    .content-body table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    .content-body th, .content-body td { border: 1px solid #e5e7eb; padding: .4rem .6rem; text-align: left; }
  </style>

  <!-- Tailwind CSS: the compiled stylesheet (built in the Docker image) when present;
       otherwise the CDN script for plain local dev. Token mapping lives in tailwind.config.js. -->
  {% set tailwind_url = tailwind_css_url() %}
  {% if tailwind_url %}
  <link rel="stylesheet" href="{{ tailwind_url }}" />
  {% else %}
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Map Tailwind tokens to the CSS variables above (R9.1): bg-primary, text-accent, font-sans, ...
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "var(--primary-color)", accent: "var(--accent-color)" },
            fontFamily: { sans: ["var(--font-family)"] },
          },
        },
      };
    }
  </script>
  {% endif %}

  <!-- HTMX + Alpine.js for reactive UI without a heavy JS framework. -->
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 flex flex-col">
  <header class="bg-primary text-white shadow" x-data="{ open: false }">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-xl font-bold tracking-tight">{{ site_name }}</a>

      <button type="button" class="md:hidden p-2 -mr-2 rounded hover:bg-white/10"
              @click="open = !open" :aria-expanded="open" aria-label="Menu">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <nav class="hidden md:flex gap-6 text-sm" aria-label="Główna nawigacja">
        <a href="/" class="hover:underline">Start</a>
        <a href="/kategorie" class="hover:underline">Kategorie</a>
        <a href="/blog" class="hover:underline">Blog</a>
        <a href="/kalendarz" class="hover:underline">Kalendarz</a>
      </nav>
    </div>

    <!-- Mobile menu (without JS the desktop nav is hidden, so keep a no-JS fallback below). -->
    <nav class="md:hidden px-4 pb-4 flex flex-col gap-2 text-sm" x-show="open" x-cloak aria-label="Menu mobilne">
      <a href="/" class="py-1">Start</a>
      <a href="/kategorie" class="py-1">Kategorie</a>
      <a href="/blog" class="py-1">Blog</a>
      <a href="/kalendarz" class="py-1">Kalendarz</a>
    </nav>
    <noscript>
      <nav class="md:hidden px-4 pb-4 flex flex-wrap gap-4 text-sm">
        <a href="/">Start</a> <a href="/kategorie">Kategorie</a> <a href="/blog">Blog</a> <a href="/kalendarz">Kalendarz</a>
      </nav>
    </noscript>
  </header>

  <main class="flex-1 max-w-5xl mx-auto px-4 py-8 w-full">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-gray-800 text-gray-300 text-sm">
    <div class="max-w-5xl mx-auto px-4 py-6">
      <p>© polskiprimal.pl — strona w budowie, nowe treści pojawiają się na bieżąco.</p>
    </div>
  </footer>
</body>
</html>

{% macro post_card(post) -%}
<article class="bg-white rounded-lg shadow flex flex-col overflow-hidden">
  {% if post.image_url %}
  <img src="{{ media_base_url }}/{{ post.image_url }}" alt="{{ post.title }}" class="w-full h-48 object-cover">
  {% endif %}
  <div class="p-5 flex flex-col flex-1">
    {% if post.published_at %}
    <time class="text-xs text-gray-500" datetime="{{ post.published_at.date().isoformat() }}">{{ post.published_at | pl_date }}</time>
    {% endif %}
    <h3 class="text-lg font-semibold text-primary mt-1">
      <a href="/blog/{{ post.slug }}" class="hover:underline">{{ post.title }}</a>
    </h3>
    <p class="text-xs text-gray-500 mt-1">{{ post.author }}</p>
    <a href="/blog/{{ post.slug }}" class="mt-3 text-sm font-medium text-primary hover:underline">Czytaj dalej →</a>
  </div>
</article>
{%- endmacro %}

{% macro category_tree(nodes) -%}
<ul class="space-y-2">
  {% for node in nodes %}
  <li>
    <a href="/kategorie/{{ node.category.slug }}" class="font-medium text-primary hover:underline">{{ node.category.title }}</a>
    {% if node.children %}
    <div class="ml-4 mt-2 border-l-2 border-gray-200 pl-4">{{ category_tree(node.children) }}</div>
    {% endif %}
  </li>
  {% endfor %}
</ul>
{%- endmacro %}
